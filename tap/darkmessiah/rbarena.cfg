// A combat sandbox for hand-played recordings (docs/recording.md, "A save past the ride").
// Run once per session after +load rb_start. god toggles, so a second exec turns it off.
sv_cheats 1
god
// mm_player_skills_grosbill 1 unlocks every skill module (Trample among them). Off by default: the
// combat model doesn't see skills, so a fight recorded with them scores the player's damage wrong.
mm_ai_bullet_time 1
give weapon_arx_short_sword
use weapon_arx_short_sword
setpos 0 -2400 0
setang 15 90 0
wait 20
mm_npc_create npc_orc_sword models/npc/orc/npc_orc.mdl weapon_arxorccleaver weapon_arxcrossbow 0
setang 15 70 0
wait 20
mm_npc_create npc_orc_sword models/npc/orc/npc_orc.mdl weapon_arxorccleaver weapon_arxcrossbow 0
setang 0 90 0
// The parry bot turns with J and L (docs/recording.md, "The parry bot").
cl_yawspeed 90
bind "j" "+left"
bind "l" "+right"
